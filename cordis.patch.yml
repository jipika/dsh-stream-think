# dsh-stream-think 的 bundle 层补丁。包出现在 profile 的 dsh.profile.bundles
# 列表里时自动应用（与上游 dsh-smooth-stream 同构：Host 半边提供 boot config
# 桥与设置 RPC，Client 半边接管 assistant-step 渲染）。
#
# 注意：本文件里的 insert id（stream-think）是全局唯一的。**不要**再在
# profile 自己的 cordis.patch.yml 里重复 insert 同一个 id —— 两处都 insert 会撞成
# `duplicate loader entry id`，整个 plugin tree 在 include 阶段起不来。
- insert:
    - id: stream-think
      name: dsh-stream-think
      config:
        mode: typewriter
        preset: balanced
        revealCharsPerSec: 80
        scrollSpeedPxPerSec: 48
        maxScrollSpeedPxPerSec: 1000
